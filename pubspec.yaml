name: direction_futbol_pro
description: "Direction Futbol Pro - La plataforma definitiva para la gestión del talento futbolístico."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0
  supabase: ^2.10.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  image_picker: ^1.2.1
  youtube_player_flutter: ^9.1.3
  path_provider: ^2.1.5
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_abreviado.png
    - assets/images/logo1.ico
    - assets/images/logo2.png
